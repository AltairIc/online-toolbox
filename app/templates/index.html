 {% extends "base.html" %}
 {% block title %}ToolBox{% endblock %}
 {% block content %}
 <div class="text-center mb-10">
     <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-3">Free Online Tools</h1>
     <p class="text-gray-500 text-lg">Useful utilities for developers, writers, and designers. All free, no signup needed.</p>
 </div>
 <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
     {% for tool in tools %}
     <a href="/tool/{{ tool.id }}" class="tool-card bg-white rounded-xl p-5 border border-gray-100 cursor-pointer block">
         <div class="flex items-start gap-3">
             <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center flex-shrink-0">
                 <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
             </div>
             <div>
                 <h3 class="font-semibold text-gray-900">{{ tool.name }}</h3>
                 <p class="text-sm text-gray-500 mt-0.5">{{ tool.desc }}</p>
             </div>
         </div>
     </a>
     {% endfor %}
 </div>
 {% endblock %}
