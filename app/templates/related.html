<div class="mt-8 pt-6 border-t border-gray-200">
    <h3 class="text-lg font-semibold text-gray-900 mb-3"><span class="lang-en">You May Also Like</span><span class="lang-zh" style="display:none">你可能还喜欢</span></h3>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
        {% for rt in related %}
        <a href="/tool/{{ rt.id }}" class="p-3 bg-gray-50 rounded-lg hover:bg-blue-50 transition text-sm">
            <div class="font-medium text-gray-900">{{ rt.name }}</div>
            <div class="text-xs text-gray-500 mt-0.5">{{ rt.desc[:60] }}</div>
        </a>
        {% endfor %}
    </div>
</div>
