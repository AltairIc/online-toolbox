 {% extends "base.html" %}
 {% block title %}JSON Formatter - Validate & Beautify JSON Online{% endblock %}
 {% block content %}
 <div class="bg-white rounded-xl border border-gray-200 p-6 max-w-3xl mx-auto">
     <h1 class="text-2xl font-bold text-gray-900 mb-2">JSON Formatter</h1>
     <p class="text-gray-500 mb-4">Format, validate and beautify your JSON data. Paste your JSON below and click Format.</p>
     <textarea id="inputJson" rows="10" class="w-full mb-4 font-mono text-sm" placeholder='{"name": "John", "age": 30}'></textarea>
     <div class="flex items-center gap-4 mb-4">
         <button class="px-6 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700" onclick="formatJson()">Format JSON</button>
         <label class="text-sm text-gray-600">Indent: <select id="indentSize"><option value="2">2</option><option value="4">4</option><option value="8">8</option></select></label>
         <span id="validBadge" class="hidden px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-700">Valid JSON</span>
     </div>
     <textarea id="resultJson" rows="10" class="w-full font-mono text-sm" readonly placeholder="Formatted JSON will appear here..."></textarea>
     <button class="mt-2 text-sm text-blue-600 hover:underline" onclick="copyResult()">Copy to clipboard</button>
 </div>
 <script>async function formatJson(){const r=await fetch('/api/json-formatter',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:document.getElementById('inputJson').value,indent:parseInt(document.getElementById('indentSize').value)})});const d=await r.json();document.getElementById('resultJson').value=d.result;const badge=document.getElementById('validBadge');badge.className=d.valid?'px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-700':'px-3 py-1 rounded-full text-xs font-medium bg-red-100 text-red-700';badge.textContent=d.valid?'Valid JSON':'Invalid JSON';badge.classList.remove('hidden')}function copyResult(){const t=document.getElementById('resultJson');t.select();navigator.clipboard.writeText(t.value)}</script>
 {% endblock %}
