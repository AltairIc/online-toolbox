 {% extends "base.html" %}
 {% block title %}Text Case Converter - Convert Text Case Online{% endblock %}
 {% block content %}
 <div class="bg-white rounded-xl border border-gray-200 p-6 max-w-3xl mx-auto">
     <h1 class="text-2xl font-bold text-gray-900 mb-2">Text Case Converter</h1>
     <p class="text-gray-500 mb-4">Convert text between different cases: uppercase, lowercase, title case, camelCase, snake_case and more.</p>
     <textarea id="inputText" rows="6" class="w-full mb-4" placeholder="Enter text to convert..."></textarea>
     <div class="flex flex-wrap gap-2 mb-4">
         <button class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700" onclick="convert('upper')">UPPER CASE</button>
         <button class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700" onclick="convert('lower')">lower case</button>
         <button class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700" onclick="convert('title')">Title Case</button>
         <button class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700" onclick="convert('sentence')">Sentence case</button>
         <button class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-medium hover:bg-green-700" onclick="convert('camel')">camelCase</button>
         <button class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-medium hover:bg-green-700" onclick="convert('snake')">snake_case</button>
         <button class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-medium hover:bg-green-700" onclick="convert('kebab')">kebab-case</button>
     </div>
     <textarea id="resultText" rows="6" class="w-full mb-2 font-mono text-sm" readonly placeholder="Result will appear here..."></textarea>
     <button class="text-sm text-blue-600 hover:underline" onclick="copyResult()">Copy to clipboard</button>
 </div>
 <script>async function convert(caseType){const r=await fetch('/api/text-case',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.getElementById('inputText').value,case:caseType})});const d=await r.json();document.getElementById('resultText').value=d.result}function copyResult(){const t=document.getElementById('resultText');t.select();navigator.clipboard.writeText(t.value)}</script>
 {% endblock %}
