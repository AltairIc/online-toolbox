{% extends "base.html" %}
{% block title %}Image Crop - Crop Images Online Free{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-xl border border-gray-200 p-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-2"><span class="lang-en">Image Crop</span><span class="lang-zh" style="display:none">图片裁剪</span></h1>
        <p class="text-gray-500 mb-4"><span class="lang-en">Drag corners to resize, drag center to move.</span><span class="lang-zh" style="display:none">拖拽角调整大小，拖拽中间移动选框。</span></p>
        <div class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center mb-4" id="dropZone">
            <svg class="w-10 h-10 mx-auto text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <p class="text-gray-500 text-sm"><span class="lang-en">Click to upload or drag an image</span><span class="lang-zh" style="display:none">点击上传或拖拽图片</span></p>
            <input type="file" id="fileInput" accept="image/*" class="hidden">
        </div>
        <div id="editor" class="hidden">
            <div class="flex flex-wrap gap-2 mb-4">
                <button onclick="setRatio('free')" id="rFree" class="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-medium"><span class="lang-en">Free</span><span class="lang-zh" style="display:none">自由</span></button>
                <button onclick="setRatio('1:1')" class="px-3 py-1.5 bg-gray-100 rounded-lg text-xs hover:bg-gray-200">1:1</button>
                <button onclick="setRatio('4:3')" class="px-3 py-1.5 bg-gray-100 rounded-lg text-xs hover:bg-gray-200">4:3</button>
                <button onclick="setRatio('3:2')" class="px-3 py-1.5 bg-gray-100 rounded-lg text-xs hover:bg-gray-200">3:2</button>
                <button onclick="setRatio('16:9')" class="px-3 py-1.5 bg-gray-100 rounded-lg text-xs hover:bg-gray-200">16:9</button>
            </div>
            <div class="relative bg-gray-100 rounded-lg overflow-hidden mb-4" style="max-height:500px">
                <canvas id="canvas" class="w-full cursor-crosshair"></canvas>
            </div>
            <button onclick="cropImage()" class="px-6 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700"><span class="lang-en">Crop & Download</span><span class="lang-zh" style="display:none">裁剪并下载</span></button>
        </div>
    </div>
</div>
<script>
var canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");
var img=null,ratio="free",crop={x:0,y:0,w:0,h:0};var drag={active:false,mode:"",startX:0,startY:0,ox:0,oy:0,ow:0,oh:0};
document.getElementById("dropZone").onclick=function(){document.getElementById("fileInput").click()};
document.getElementById("dropZone").ondragover=function(e){e.preventDefault();this.style.borderColor="#3b82f6"};
document.getElementById("dropZone").ondragleave=function(){this.style.borderColor=""};
document.getElementById("dropZone").ondrop=function(e){e.preventDefault();this.style.borderColor="";if(e.dataTransfer.files.length)loadFile(e.dataTransfer.files[0])};
document.getElementById("fileInput").onchange=function(e){if(e.target.files[0])loadFile(e.target.files[0])};
function loadFile(file){var r=new FileReader();r.onload=function(e){var i=new Image();i.onload=function(){img=i;canvas.width=Math.min(i.width,2400);canvas.height=Math.min(i.height,1800);ctx.drawImage(i,0,0,canvas.width,canvas.height);var m=Math.min(canvas.width,canvas.height);crop={x:Math.min(10,Math.round(canvas.width*0.05)),y:Math.min(10,Math.round(canvas.height*0.05)),w:Math.round(canvas.width*0.9),h:Math.round(canvas.height*0.9)};drawCrop();document.getElementById("editor").classList.remove("hidden");document.getElementById("dropZone").classList.add("hidden")};i.src=e.target.result};r.readAsDataURL(file)}
function drawCrop(){ctx.drawImage(img,0,0,canvas.width,canvas.height);ctx.fillStyle="rgba(0,0,0,0.4)";ctx.fillRect(0,0,canvas.width,crop.y);ctx.fillRect(0,crop.y,crop.x,crop.h);ctx.fillRect(crop.x+crop.w,crop.y,canvas.width-crop.x-crop.w,crop.h);ctx.fillRect(0,crop.y+crop.h,canvas.width,canvas.height-crop.y-crop.h);ctx.strokeStyle="white";ctx.lineWidth=2;ctx.strokeRect(crop.x,crop.y,crop.w,crop.h);var s=6;ctx.fillStyle="white";ctx.strokeStyle="#3b82f6";ctx.lineWidth=2;[[crop.x,crop.y],[crop.x+crop.w,crop.y],[crop.x,crop.y+crop.h],[crop.x+crop.w,crop.y+crop.h]].forEach(function(p){ctx.fillRect(p[0]-s/2,p[1]-s/2,s,s);ctx.strokeRect(p[0]-s/2,p[1]-s/2,s,s)})}
function getHit(x,y){var t=8,e=crop;if(Math.abs(x-e.x)<t&&Math.abs(y-e.y)<t)return"nw";if(Math.abs(x-e.x-e.w)<t&&Math.abs(y-e.y)<t)return"ne";if(Math.abs(x-e.x)<t&&Math.abs(y-e.y-e.h)<t)return"sw";if(Math.abs(x-e.x-e.w)<t&&Math.abs(y-e.y-e.h)<t)return"se";if(Math.abs(x-e.x)<t&&y>e.y&&y<e.y+e.h)return"w";if(Math.abs(x-e.x-e.w)<t&&y>e.y&&y<e.y+e.h)return"e";if(Math.abs(y-e.y)<t&&x>e.x&&x<e.x+e.w)return"n";if(Math.abs(y-e.y-e.h)<t&&x>e.x&&x<e.x+e.w)return"s";if(x>e.x&&x<e.x+e.w&&y>e.y&&y<e.y+e.h)return"move";return null}
canvas.onmousedown=function(e){var r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*(canvas.width/r.width),y=(e.clientY-r.top)*(canvas.height/r.height);var hit=getHit(x,y);if(!hit){crop.x=x-50;crop.y=y-50;crop.w=100;crop.h=100;drawCrop();return}drag.active=true;drag.mode=hit;drag.startX=e.clientX;drag.startY=e.clientY;drag.ox=crop.x;drag.oy=crop.y;drag.ow=crop.w;drag.oh=crop.h};
canvas.onmousemove=function(e){var r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*(canvas.width/r.width),y=(e.clientY-r.top)*(canvas.height/r.height);if(!drag.active){var h=getHit(x,y);canvas.style.cursor=h?h==="move"?"move":"nwse-resize":"crosshair";return}var dx=(e.clientX-drag.startX)*(canvas.width/r.width),dy=(e.clientY-drag.startY)*(canvas.height/r.height);switch(drag.mode){case"move":crop.x=Math.max(0,Math.min(canvas.width-drag.ow,drag.ox+dx));crop.y=Math.max(0,Math.min(canvas.height-drag.oh,drag.oy+dy));break;case"se":crop.w=Math.max(30,drag.ow+dx);crop.h=Math.max(30,drag.oh+dy);break;case"nw":crop.x=Math.min(drag.ox+drag.ow-30,drag.ox+dx);crop.y=Math.min(drag.oy+drag.oh-30,drag.oy+dy);crop.w=drag.ox+drag.ow-crop.x;crop.h=drag.oy+drag.oh-crop.y;break;case"ne":crop.x=Math.max(0,drag.ox+dx);crop.w=drag.ow-dx;crop.h=Math.max(30,drag.oh+dy);break;case"sw":crop.y=Math.max(0,drag.oy+dy);crop.w=Math.max(30,drag.ow+dx);crop.h=drag.oh-dy;break;case"e":crop.w=Math.max(30,drag.ow+dx);break;case"w":crop.x=Math.min(drag.ox+drag.ow-30,drag.ox+dx);crop.w=drag.ox+drag.ow-crop.x;break;case"s":crop.h=Math.max(30,drag.oh+dy);break;case"n":crop.y=Math.min(drag.oy+drag.oh-30,drag.oy+dy);crop.h=drag.oy+drag.oh-crop.y;break}crop.x=Math.max(0,crop.x);crop.y=Math.max(0,crop.y);crop.w=Math.min(canvas.width-crop.x,crop.w);crop.h=Math.min(canvas.height-crop.y,crop.h);drawCrop()};
canvas.onmouseup=function(){drag.active=false};
canvas.onmouseleave=function(){drag.active=false};
function setRatio(r){ratio=r;document.querySelectorAll("button").forEach(function(b){if(b.textContent.trim()===r||(r==="free"&&b.textContent.trim()==="Free")){b.className="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-medium"}else if(b.id!=="rFree"&&b.textContent.trim()!==r&&["1:1","4:3","3:2","16:9","Free","自由"].includes(b.textContent.trim())){b.className="px-3 py-1.5 bg-gray-100 rounded-lg text-xs hover:bg-gray-200"}});if(r!=="free"){var p=r.split(":").map(Number),ar=p[0]/p[1];crop.h=Math.round(crop.w/ar);if(crop.y+crop.h>canvas.height){crop.h=canvas.height-crop.y;crop.w=Math.round(crop.h*ar)}drawCrop()}}
function cropImage(){if(!img)return;var s=canvas.width/img.width;var c=document.createElement("canvas");c.width=crop.w/s;c.height=crop.h/s;c.getContext("2d").drawImage(img,crop.x/s,crop.y/s,crop.w/s,crop.h/s,0,0,c.width,c.height);var a=document.createElement("a");a.href=c.toDataURL("image/png");a.download="cropped.png";a.click()}
</script>
{% endblock %}
