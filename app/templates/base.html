         </div>
     </footer>

<script>
function setLang(lang) {
    localStorage.setItem('toolbox_lang', lang);
    document.body.classList.remove('en', 'zh');
    document.body.classList.add(lang);
    document.getElementById('langEn').classList.toggle('active', lang === 'en');
    document.getElementById('langZh').classList.toggle('active', lang === 'zh');
    document.querySelectorAll('.lang-en').forEach(el => { var d = el.classList.contains('lang-block') ? 'block' : 'inline'; el.style.display = lang === 'en' ? d : 'none'; });
    document.querySelectorAll('.lang-zh').forEach(el => { var d = el.classList.contains('lang-block') ? 'block' : 'inline'; el.style.display = lang === 'zh' ? d : 'none'; });
    // Also handle block/inline-block elements
    document.querySelectorAll('.lang-en.lang-block').forEach(el => el.style.display = lang === 'en' ? 'block' : 'none');
    document.querySelectorAll('.lang-zh.lang-block').forEach(el => el.style.display = lang === 'zh' ? 'block' : 'none');
    // Translate tool cards
    document.querySelectorAll('.tool-card h3').forEach(h3 => {
        var en = h3.getAttribute('data-en') || h3.textContent;
        if (!h3.getAttribute('data-en')) h3.setAttribute('data-en', h3.textContent);
        h3.textContent = lang === 'zh' && toolNames[en] ? toolNames[en] : en;
    });
    document.querySelectorAll('.tool-card p').forEach(p => {
        var en = p.getAttribute('data-en') || p.textContent;
        if (!p.getAttribute('data-en')) p.setAttribute('data-en', p.textContent);
        p.textContent = lang === 'zh' && toolDescs[en] ? toolDescs[en] : en;
    });
}
// Auto-detect: Chinese timezone + Chinese language preference
(function() {
    var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    var lang = navigator.language || navigator.userLanguage;
    var isZh = (tz && (tz.includes('Shanghai') || tz.includes('Beijing') || tz.includes('Chongqing') || tz.includes('Hong_Kong') || tz.includes('Taipei') || tz.includes('Urumqi'))) && lang && lang.startsWith('zh');
    var saved = localStorage.getItem('toolbox_lang');
    if (saved) { setLang(saved); }
    else if (isZh) { setLang('zh'); }
    else { setLang('en'); }
})();

function translatePage(lang) {
    // Translate text nodes using the dictionary
    var walker = document.createTreeWalker(document.body, 4, null, false);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function(node) {
        var text = node.textContent.trim();
        if (!text || text.length < 2) return;
        // Don't translate inside script/style tags
        if (node.parentNode && ['SCRIPT','STYLE'].includes(node.parentNode.tagName)) return;
        // Only translate short phrases (buttons, labels)
        if (text.length > 100) return;
        if (lang === 'zh' && translations[text]) {
            node.textContent = node.textContent.replace(text, translations[text]);
        } else if (lang === 'en' && translations[text]) {
            // Find reverse translation - crude approach
            for (var en in translations) {
                if (translations[en] === text) {
                    node.textContent = node.textContent.replace(text, en);
                    break;
                }
            }
        }
    });
    // Translate placeholders
    document.querySelectorAll('[placeholder]').forEach(function(el) {
        var p = el.getAttribute('placeholder');
        if (lang === 'zh' && translations[p]) el.setAttribute('placeholder', translations[p]);
        else if (lang === 'en') {
            for (var en in translations) {
                if (translations[en] === p) { el.setAttribute('placeholder', en); break; }
            }
        }
    });
    // Translate buttons/labels
    document.querySelectorAll('button, label, h3, .font-medium, th').forEach(function(el) {
        if (el.querySelector('*')) return; // skip elements with children
        var t = el.textContent.trim();
        if (!t || t.length < 2 || t.length > 60) return;
        if (lang === 'zh' && translations[t]) el.textContent = translations[t];
        else if (lang === 'en') {
            for (var en in translations) {
                if (translations[en] === t) { el.textContent = en; break; }
            }
        }
    });
}

// Override setLang to include page translation
var origSetLang = window.setLang;
window.setLang = function(lang) {
    localStorage.setItem('toolbox_lang', lang);
    document.body.classList.remove('en', 'zh');
    document.body.classList.add(lang);
    document.getElementById('langEn').classList.toggle('active', lang === 'en');
    document.getElementById('langZh').classList.toggle('active', lang === 'zh');
    
    // Toggle bilingual elements
    document.querySelectorAll('.lang-en').forEach(function(el) {
        var d = el.classList.contains('lang-block') ? 'block' : 'inline';
        el.style.display = lang === 'en' ? d : 'none';
    });
    document.querySelectorAll('.lang-zh').forEach(function(el) {
        var d = el.classList.contains('lang-block') ? 'block' : 'inline';
        el.style.display = lang === 'zh' ? d : 'none';
    });
    
    // Translate tool cards
    document.querySelectorAll('.tool-card h3').forEach(function(h3) {
        var en = h3.getAttribute('data-en') || h3.textContent;
        if (!h3.getAttribute('data-en')) h3.setAttribute('data-en', h3.textContent);
        h3.textContent = lang === 'zh' && toolNames[en] ? toolNames[en] : en;
    });
    document.querySelectorAll('.tool-card p').forEach(function(p) {
        var en = p.getAttribute('data-en') || p.textContent;
        if (!p.getAttribute('data-en')) p.setAttribute('data-en', p.textContent);
        p.textContent = lang === 'zh' && toolDescs[en] ? toolDescs[en] : en;
    });
    
    // Translate page content
    translatePage(lang);
};
